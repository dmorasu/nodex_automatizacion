# Nginx · Nodex Monitor en monitor.nodexgpa.com
# Copiar a /etc/nginx/sites-available/nodex-monitor, enlazar en sites-enabled y luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d monitor.nodexgpa.com
# Certbot agrega el bloque HTTPS (443) y la redirección desde HTTP.

# Ingreso: 10 intentos por minuto por IP (el monitor además bloquea 15 min tras 5 fallidos)
limit_req_zone $binary_remote_addr zone=monitor_ingreso:1m rate=10r/m;

server {
    listen 80;
    server_name monitor.nodexgpa.com;
    include snippets/seguridad-nodexgpa.conf;
    client_max_body_size 8k;

    # Opcional, más seguro: solo desde la IP de la oficina (y la del celular no serviría fuera de ella)
    # allow 190.0.0.0;
    # deny all;

    location = /ingresar {
        limit_req zone=monitor_ingreso burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
