# Nginx · Nodex en nodexgpa.com (ensayo en los puertos 9000-9003)
# Copiar a /etc/nginx/sites-available/nodexgpa, enlazar en sites-enabled y luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tramites.nodexgpa.com -d gastos.nodexgpa.com -d tramitadores.nodexgpa.com -d api.nodexgpa.com
# Certbot agrega solo el bloque HTTPS (443) y la redirección desde HTTP.
# Encabezados de seguridad: copiar nginx-seguridad-nodexgpa.conf a /etc/nginx/snippets/seguridad-nodexgpa.conf

# Encabezados comunes para las apps Next.js
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Límite de peticiones de la API externa: 5 por segundo por IP (con ráfagas de 20)
limit_req_zone $binary_remote_addr zone=api_externa:1m rate=5r/s;

server {
    listen 80;
    server_name tramites.nodexgpa.com;
    include snippets/seguridad-nodexgpa.conf;
    client_max_body_size 25m;   # soportes, Excel y fotos

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name gastos.nodexgpa.com;
    include snippets/seguridad-nodexgpa.conf;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name tramitadores.nodexgpa.com;
    include snippets/seguridad-nodexgpa.conf;
    client_max_body_size 25m;   # fotos desde el celular

    location / {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# API: las apps la llaman por dentro (127.0.0.1:9000), así que al público solo se abre
# /api/externa (la plataforma externa, que además exige X-API-Key). El resto responde 404.
server {
    listen 80;
    server_name api.nodexgpa.com;
    include snippets/seguridad-nodexgpa.conf;

    location /api/externa/ {
        # Cuando se conozca la IP de la plataforma externa, dejar solo esa:
        # allow 203.0.113.10;
        # deny all;
        limit_req zone=api_externa burst=20 nodelay;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
