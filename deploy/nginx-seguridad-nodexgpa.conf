# Encabezados de seguridad de Nodex en nodexgpa.com (2026-10-12)
# Copiar a /etc/nginx/snippets/seguridad-nodexgpa.conf; cada bloque server de nodexgpa.com lo
# incluye con: include snippets/seguridad-nodexgpa.conf;
# Va dentro de los bloques de nodexgpa.com (no en http {}), así no toca otros sitios del servidor.

# No mostrar la versión de Nginx en errores ni encabezados
server_tokens off;

# El navegador usa siempre HTTPS con estos subdominios durante un año.
# Sin includeSubDomains ni preload a propósito: no afecta a otros subdominios de nodexgpa.com.
add_header Strict-Transport-Security "max-age=31536000" always;

# Otra página no puede mostrar Nodex dentro de un marco (clickjacking); el visor de
# documentos de la misma app sí puede
add_header X-Frame-Options "SAMEORIGIN" always;

# El navegador respeta el tipo de archivo que manda el servidor (no "adivina" y ejecuta)
add_header X-Content-Type-Options "nosniff" always;

# A otros sitios solo se les dice el dominio de origen, nunca la ruta (ej. /center/solicitudTramites/123)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Las apps Next.js ya no lo envían (poweredByHeader: false); por si acaso
proxy_hide_header X-Powered-By;
