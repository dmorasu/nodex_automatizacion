# Nginx · Nodex en nodexgpa.com (ensayo en los puertos 9000-9003)
# Copiar a /etc/nginx/sites-available/nodexgpa, enlazar en sites-enabled y luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tramites.nodexgpa.com -d gastos.nodexgpa.com -d tramitadores.nodexgpa.com -d api.nodexgpa.com
# Certbot agrega solo el bloque HTTPS (443) y la redirección desde HTTP.

# Encabezados comunes para las apps Next.js
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name tramites.nodexgpa.com;
    client_max_body_size 25m;   # soportes, Excel y fotos

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name gastos.nodexgpa.com;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name tramitadores.nodexgpa.com;
    client_max_body_size 25m;   # fotos desde el celular

    location / {
        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# API: la usan las apps desde el servidor (127.0.0.1:9000) y la plataforma externa (/api/externa)
server {
    listen 80;
    server_name api.nodexgpa.com;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
